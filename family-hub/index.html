<title>Family Hub</title>
<style>
  :root{
    --bg:#f6f4ef; --surface:#ffffff; --surface-2:#faf8f4; --border:#e7e2d9;
    --text:#232019; --muted:#7c7568; --accent:#5a7d6f; --accent-soft:#e6efe9;
    --pa:#3d6fb4; --pa-soft:#e5eef8; --pb:#c0693e; --pb-soft:#fbeadf;
    --both:#8a6db0; --both-soft:#efe8f6; --danger:#c0483e; --shadow:0 1px 3px rgba(40,35,25,.08),0 6px 20px rgba(40,35,25,.05);
    --sport:#b3841a; --sport-soft:#faf1de; --fun:#c14f82; --fun-soft:#f8e8ef;
    --radius:16px;
    --font:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#18160f; --surface:#232019; --surface-2:#1e1b14; --border:#38332a;
      --text:#f0ece2; --muted:#a49b8a; --accent:#7fb0a0; --accent-soft:#26332e;
      --pa:#6fa0dd; --pa-soft:#1d2a3a; --pb:#e08a5c; --pb-soft:#33231a;
      --both:#b199d6; --both-soft:#2b2338; --danger:#e07068;
      --sport:#e0ac4a; --sport-soft:#3a2f18; --fun:#e08fb0; --fun-soft:#3a2530;
      --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#18160f; --surface:#232019; --surface-2:#1e1b14; --border:#38332a;
    --text:#f0ece2; --muted:#a49b8a; --accent:#7fb0a0; --accent-soft:#26332e;
    --pa:#6fa0dd; --pa-soft:#1d2a3a; --pb:#e08a5c; --pb-soft:#33231a;
    --both:#b199d6; --both-soft:#2b2338; --danger:#e07068;
    --sport:#e0ac4a; --sport-soft:#3a2f18; --fun:#e08fb0; --fun-soft:#3a2530;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:84px}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  a{color:var(--accent)}

  /* Header */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .head-in{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:920px;margin:0 auto}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:18px;flex:none}
  .head-title{font-size:19px;font-weight:800}
  .head-sub{font-size:12.5px;color:var(--muted);font-weight:600}
  .theme-btn{margin-left:auto;background:var(--surface);border:1px solid var(--border);
    width:38px;height:38px;border-radius:11px;font-size:16px;color:var(--text)}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin:16px 0}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .grow{flex:1;min-width:0}

  /* Today hero */
  .hero{border-radius:var(--radius);padding:22px;color:#fff;position:relative;overflow:hidden;
    box-shadow:var(--shadow)}
  .hero small{opacity:.9;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
  .hero .big{font-size:30px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
  .hero .hand{font-size:14px;font-weight:700;opacity:.95;margin-top:10px;
    background:rgba(255,255,255,.18);display:inline-block;padding:6px 12px;border-radius:99px}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;
    padding:4px 10px;border-radius:99px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}

  /* Calendar */
  .cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .cal-nav{background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    width:36px;height:36px;border-radius:10px;font-size:16px}
  .cal-title{font-size:17px;font-weight:800;flex:1;text-align:center}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0;text-transform:uppercase}
  .cell{aspect-ratio:1/1;border-radius:11px;border:1.5px solid transparent;padding:5px 4px;
    display:flex;flex-direction:column;gap:2px;cursor:pointer;position:relative;min-height:0;
    transition:transform .08s}
  .cell:active{transform:scale(.96)}
  .cell.out{opacity:.32}
  .cell .num{font-size:13px;font-weight:800;line-height:1}
  .cell.today{border-color:var(--text)}
  .cell .who{font-size:9px;font-weight:800;opacity:.85;margin-top:auto;text-transform:uppercase;letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .marks{display:flex;gap:2px;flex-wrap:wrap}
  .mk{width:5px;height:5px;border-radius:50%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}

  /* List items */
  .item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
  .item:first-child{border-top:none}
  .item .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
  .item .t{font-weight:700;font-size:15px}
  .item .m{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
  .item .rt{margin-left:auto;text-align:right;flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);background:var(--surface-2);
    flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
  .chk.on{background:var(--accent);border-color:var(--accent)}
  .done .t{text-decoration:line-through;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);font-weight:600;font-size:14px;padding:22px 0}
  .iconbtn{background:none;border:none;color:var(--muted);font-size:15px;padding:4px}

  /* Buttons */
  .btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 16px;
    font-weight:800;font-size:14.5px}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .btn.block{width:100%}
  .btn.danger{background:var(--danger)}

  /* Tabs */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-weight:800;font-size:10.5px;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;text-transform:uppercase;letter-spacing:.02em}
  nav.tabs button .ti{font-size:20px}
  nav.tabs button.active{color:var(--accent)}
  nav.tabs button.active .ti{transform:translateY(-1px)}

  /* Forms & fields */
  label.fld{display:block;margin:12px 0}
  label.fld .lb{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.03em}
  .in{width:100%;padding:11px 12px;border-radius:11px;border:1.5px solid var(--border);
    background:var(--surface-2);color:var(--text)}
  .in:focus{outline:none;border-color:var(--accent)}
  textarea.in{resize:vertical;min-height:60px}

  /* Modal */
  .scrim{position:fixed;inset:0;background:rgba(20,16,10,.5);z-index:40;display:none;
    align-items:flex-end;justify-content:center;padding:0}
  .scrim.on{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;
    box-shadow:0 -8px 40px rgba(0,0,0,.25)}
  .sheet h3{font-size:19px;margin-bottom:4px}
  .sheet .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .seg .opt{flex:1;min-width:70px;text-align:center;padding:10px;border-radius:11px;border:1.5px solid var(--border);
    background:var(--surface-2);font-weight:800;font-size:13px;color:var(--text)}
  .seg .opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .close{position:absolute}
  @media(min-width:560px){.scrim{align-items:center}.sheet{border-radius:22px}}

  .day-detail .pill{margin-bottom:10px}
  .muted{color:var(--muted)}
  .mini{font-size:12px;color:var(--muted);font-weight:600}
  .banner{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;
    font-size:13px;font-weight:700;margin-bottom:12px}
  .hidden{display:none!important}
  code{background:var(--surface-2);border:1px solid var(--border);padding:1px 5px;border-radius:5px;font-size:12.5px}
</style>

  function itemEvent(e,d){
    var ty=TYPES[e.type]||{i:"📅",l:e.type};

    var click = e.synthetic?'':' onclick="FH.editEvent(\''+e.id+'\')"';
    var tag = e.synthetic?' <span class="mini">(recurring)</span>':'';
    return '<div class="item"'+click+'><div class="ic" style="'+colStyleType(e.type)+'">'+ty.i+'</div>'+
      '<div class="grow"><div class="t">'+esc(e.title)+tag+'</div><div class="m">'+esc(when)+' · '+ty.l+'</div></div></div>';

  function itemTodo(t,overdue){
    var who = t.who==="both"?"Both":t.who==="a"?parentOf("a").name:t.who==="b"?parentOf("b").name:"";
    var wc = t.who==="both"?"both":t.who==="a"?colorVar("a"):t.who==="b"?colorVar("b"):"accent";
    var due = t.due?(iso(cur)===t.due?"Today":fmt(parse(t.due))):"";
    var meta=[]; if(who) meta.push(who); if(due) meta.push((overdue?"⚠️ ":"")+due);
    return '<div class="item '+(t.done?"done":"")+'">'+
      '<div class="chk '+(t.done?"on":"")+'" onclick="FH.toggleTodo(\''+t.id+'\')">'+(t.done?"✓":"")+'</div>'+
      '<div class="grow" onclick="FH.editTodo(\''+t.id+'\')"><div class="t">'+(CATS[t.cat]||"")+' '+esc(t.title)+'</div>'+
      (meta.length?'<div class="m">'+esc(meta.join(" · "))+'</div>':'')+'</div>'+
      (who?'<div class="rt"><span class="pill" style="'+ (t.who==="both"?"background:var(--both-soft);color:var(--both)": (t.who==="a"?colStyle("a"):colStyle("b"))) +'"><span class="dot" style="background:var(--'+wc+')"></span>'+esc(who)+'</span></div>':'')+
      '</div>';

  function renderCalendar(){
    var y=calMonth.getFullYear(), m=calMonth.getMonth();
    var first=new Date(y,m,1), startDow=first.getDay();
    var gridStart=addDays(first,-startDow);
    var h='<div class="card">';
    h+='<div class="cal-head"><button class="cal-nav" onclick="FH.calNav(-1)">‹</button>'+
       '<div class="cal-title">'+MON[m]+' '+y+'</div>'+
       '<button class="cal-nav" onclick="FH.calNav(1)">›</button>'+
       '<button class="cal-nav" onclick="FH.calToday()" title="Jump to today">•</button></div>';
    h+='<div class="grid7">';
    ["S","M","T","W","T","F","S"].forEach(function(d){ h+='<div class="dow">'+d+'</div>'; });
    for(var i=0;i<42;i++){
      var d=addDays(gridStart,i), di=iso(d), w=whoOn(d), c=colorVar(w), p=parentOf(w);
      var out = d.getMonth()!==m;
      var isToday = di===iso(cur);
      var evs=eventsOn(di), tds=todosOn(di).filter(function(t){return !t.done;});
      var marks="";
      evs.slice(0,3).forEach(function(){ marks+='<span class="mk" style="background:var(--accent)"></span>'; });
      if(tds.length) marks+='<span class="mk" style="background:var(--danger)"></span>';
      h+='<div class="cell '+(out?"out":"")+' '+(isToday?"today":"")+'" style="background:var(--'+c+'-soft)" onclick="FH.openDay(\''+di+'\')">'+
         '<div class="num" style="color:var(--'+c+')">'+d.getDate()+'</div>'+
         '<div class="marks">'+marks+'</div>'+
         '<div class="who" style="color:var(--'+c+')">'+esc(p.name.split(" ")[0])+'</div>'+
         '</div>';
      if(i>=34 && d.getMonth()!==m && addDays(gridStart,i+1).getMonth()!==m && (i+1)%7===0) break;
    }
    h+='</div>';
    h+='<div class="legend">'+
       '<span><span class="dot" style="background:var(--'+colorVar("a")+')"></span>'+esc(parentOf("a").name)+'</span>'+
       '<span><span class="dot" style="background:var(--'+colorVar("b")+')"></span>'+esc(parentOf("b").name)+'</span>'+
       '<span><span class="dot" style="background:var(--accent)"></span>School event</span>'+
       '<span><span class="dot" style="background:var(--danger)"></span>To-do due</span></div>';
    h+='</div>';
    document.getElementById("view-calendar").innerHTML=h;
  }

  function eventsByTypeInRange(type,daysAhead){
    var out=[], seen={};
    S.events.filter(function(e){return e.type===type;}).forEach(function(e){ out.push(e); seen[e.id]=1; });
    for(var i=-14;i<daysAhead;i++){
      genRecurringFor(iso(addDays(cur,i))).filter(function(e){return e.type===type;}).forEach(function(e){ if(!seen[e.id]){ out.push(e); seen[e.id]=1; } });
    }
    return out;
  }

  function openSheet(html){ sheet.innerHTML=html; scrim.classList.add("on"); }
  function closeSheet(){ scrim.classList.remove("on"); }
  scrim.addEventListener("click",function(e){ if(e.target===scrim) closeSheet(); });

  function openDay(di){
    var d=parse(di), w=whoOn(d), p=parentOf(w);
    var evs=eventsOn(di), tds=todosOn(di);
    var h='<h3>'+fmt(d)+'</h3>';
    h+='<div style="height:12px"></div><span class="pill" style="'+colStyle(w)+'"><span class="dot" style="background:var(--'+colorVar(w)+')"></span>'+esc(p.name)+' · '+esc(p.home)+'</span>';
    var ho=nextHandoff(d);
    h+='<div class="day-detail">';
    h+='<div style="margin:14px 0 6px" class="mini">SCHOOL EVENTS</div>';
    if(evs.length===0) h+='<div class="mini">None</div>';
    else evs.forEach(function(e){ h+=itemEvent(e); });
    h+='<div style="margin:14px 0 6px" class="mini">TO-DOS DUE</div>';
    if(tds.length===0) h+='<div class="mini">None</div>';
    else tds.forEach(function(t){ h+=itemTodo(t,false); });
    h+='<div style="height:16px"></div>';
    h+='<div class="row"><button class="btn grow" onclick="FH.addEvent(\''+di+'\')">+ School event</button>'+
       '<button class="btn ghost grow" onclick="FH.addTodo(\''+di+'\')">+ To-do</button></div>';
    h+='</div>';
    openSheet(h);
  }

  function eventForm(ev,presetDate,presetType){
    ev=ev||{id:"",title:"",date:presetDate||iso(cur),time:"",type:presetType||"event",notes:"",remind:"1"};
    var tsel="";
    Object.keys(TYPES).forEach(function(k){ tsel+='<div class="opt '+(ev.type===k?"sel":"")+'" data-type="'+k+'" onclick="FH.pick(this,\'type\')">'+TYPES[k].i+' '+TYPES[k].l+'</div>'; });
    var h='<h3>'+(ev.id?"Edit":"New")+' '+(TYPES[ev.type]?TYPES[ev.type].l.toLowerCase():"event")+'</h3><div style="height:10px"></div>';
    h+='<input type="hidden" id="f_id" value="'+esc(ev.id)+'">';
    h+='<label class="fld"><span class="lb">Title</span><input class="in" id="f_title" value="'+esc(ev.title)+'" placeholder="e.g. Early release / Field trip"></label>';
    h+='<div class="row"><label class="fld grow"><span class="lb">Date</span><input class="in" type="date" id="f_date" value="'+esc(ev.date)+'"></label>'+
       '<label class="fld grow"><span class="lb">Time (optional)</span><input class="in" type="time" id="f_time" value="'+esc(ev.time)+'"></label></div>';
    h+='<label class="fld"><span class="lb">Type</span><div class="seg" id="typeSeg">'+tsel+'</div></label>';
    h+='<label class="fld"><span class="lb">Notes</span><textarea class="in" id="f_notes" placeholder="Who needs to know, what to bring…">'+esc(ev.notes)+'</textarea></label>';
    h+='<div style="height:6px"></div><button class="btn block" onclick="FH.saveEvent()">Save event</button>';
    if(ev.id) h+='<div style="height:8px"></div><button class="btn ghost block" onclick="FH.delEvent(\''+ev.id+'\')">Delete</button>';
    openSheet(h);
  }

  function todoForm(t,presetDate){
    t=t||{id:"",title:"",due:presetDate||"",who:"both",cat:"other",done:false};
    var csel=""; Object.keys(CATS).forEach(function(k){ csel+='<div class="opt '+(t.cat===k?"sel":"")+'" data-cat="'+k+'" onclick="FH.pick(this,\'cat\')">'+CATS[k]+' '+k+'</div>'; });
    var wsel="";
    [["a",parentOf("a").name],["b",parentOf("b").name],["both","Both"]].forEach(function(o){
      wsel+='<div class="opt '+(t.who===o[0]?"sel":"")+'" data-who="'+o[0]+'" onclick="FH.pick(this,\'who\')">'+esc(o[1])+'</div>';
    });
    var h='<h3>'+(t.id?"Edit":"New")+' to-do</h3><div style="height:10px"></div>';
    h+='<input type="hidden" id="t_id" value="'+esc(t.id)+'">';
    h+='<label class="fld"><span class="lb">What needs doing?</span><input class="in" id="t_title" value="'+esc(t.title)+'" placeholder="e.g. Sign permission slip"></label>';
    h+='<label class="fld"><span class="lb">Due date (optional)</span><input class="in" type="date" id="t_due" value="'+esc(t.due)+'"></label>';
    h+='<label class="fld"><span class="lb">Responsible</span><div class="seg" id="whoSeg">'+wsel+'</div></label>';
    h+='<label class="fld"><span class="lb">Category</span><div class="seg" id="catSeg">'+csel+'</div></label>';
    h+='<div style="height:6px"></div><button class="btn block" onclick="FH.saveTodo()">Save to-do</button>';
    if(t.id) h+='<div style="height:8px"></div><button class="btn ghost block" onclick="FH.delTodo(\''+t.id+'\')">Delete</button>';
    openSheet(h);
  }

  // ---------- public API ----------
  var FH = {
    tab:function(name){
      ["today","calendar","school","sports","activities","todos","volunteers","settings"].forEach(function(v){
        document.getElementById("view-"+v).classList.toggle("hidden",v!==name);
      });
      document.querySelectorAll("nav.tabs button").forEach(function(b){ b.classList.toggle("active",b.dataset.tab===name); });
      if(name==="today") renderToday();
      if(name==="calendar") renderCalendar();
      if(name==="school") renderSchool();
      if(name==="sports") renderSports();
      if(name==="activities") renderActivities();
      if(name==="todos") renderTodos();
      if(name==="volunteers") renderVolunteers();
      if(name==="settings") renderSettings();
      window.scrollTo(0,0);
    },
    addVol:function(){ volForm(null); },
    editVol:function(id){ var v=S.volunteers.find(function(x){return x.id===id;}); if(v) volForm(v); },
    saveVol:function(){
      var id=document.getElementById("v_id").value;
      var title=document.getElementById("v_title").value.trim(); if(!title){ alert("Add a title."); return; }
      var obj={id:id||uid(),title:title,org:document.getElementById("v_org").value.trim(),
        date:document.getElementById("v_date").value,time:document.getElementById("v_time").value,
        hours:document.getElementById("v_hours").value,
        who:sheet.querySelector("#volWhoSeg .opt.sel").dataset.who,
        status:sheet.querySelector("#volStatusSeg .opt.sel").dataset.status,notes:""};
      if(id){ var i=S.volunteers.findIndex(function(x){return x.id===id;}); S.volunteers[i]=obj; } else S.volunteers.push(obj);
      save(); closeSheet(); refresh();
    },
    delVol:function(id){ S.volunteers=S.volunteers.filter(function(x){return x.id!==id;}); save(); closeSheet(); refresh(); },
    toggleVol:function(id){ var v=S.volunteers.find(function(x){return x.id===id;}); if(v){ v.status=v.status==="completed"?"signedup":"completed"; save(); refresh(); } },
    showTeacher:function(){ openTeacherModal(); },
    closeTeacher:function(){ try{ localStorage.setItem("familyHub.teacherSeen", TEACHER_NOTE.week); }catch(e){} closeSheet(); },
    showProgress:function(){ openProgressModal(); },
    closeSheet:function(){ closeSheet(); },
    calNav:function(n){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1); renderCalendar(); },
    calToday:function(){ calMonth=new Date(cur.getFullYear(),cur.getMonth(),1); renderCalendar(); },
    openDay:openDay,
    addEvent:function(d){ eventForm(null,d); },
    addSports:function(d){ eventForm(null,d,"sports"); },
    addActivity:function(d){ eventForm(null,d,"activity"); },
    editEvent:function(id){ var e=S.events.find(function(x){return x.id===id;}); if(e) eventForm(e); },
    saveEvent:function(){
      var id=document.getElementById("f_id").value;
      var title=document.getElementById("f_title").value.trim(); if(!title){ alert("Please add a title."); return; }
      var obj={id:id||uid(),title:title,date:document.getElementById("f_date").value,
        time:document.getElementById("f_time").value,type:sheet.querySelector("#typeSeg .opt.sel").dataset.type,
        notes:document.getElementById("f_notes").value.trim()};
      if(id){ var i=S.events.findIndex(function(x){return x.id===id;}); S.events[i]=obj; } else S.events.push(obj);
      save(); closeSheet(); refresh();
    },
    delEvent:function(id){ S.events=S.events.filter(function(x){return x.id!==id;}); save(); closeSheet(); refresh(); },
    addTodo:function(d){ todoForm(null,d); },
    editTodo:function(id){ var t=S.todos.find(function(x){return x.id===id;}); if(t) todoForm(t); },
    saveTodo:function(){
      var id=document.getElementById("t_id").value;
      var title=document.getElementById("t_title").value.trim(); if(!title){ alert("Please add a title."); return; }
      var obj={id:id||uid(),title:title,due:document.getElementById("t_due").value,
        who:sheet.querySelector("#whoSeg .opt.sel").dataset.who,cat:sheet.querySelector("#catSeg .opt.sel").dataset.cat,
        done:id?S.todos.find(function(x){return x.id===id;}).done:false};
      if(id){ var i=S.todos.findIndex(function(x){return x.id===id;}); S.todos[i]=obj; } else S.todos.push(obj);
      save(); closeSheet(); refresh();
    },
    delTodo:function(id){ S.todos=S.todos.filter(function(x){return x.id!==id;}); save(); closeSheet(); refresh(); },
    toggleTodo:function(id){ var t=S.todos.find(function(x){return x.id===id;}); if(t){ t.done=!t.done; save(); refresh(); } },
    toggleHomeworkTodo:function(id){ var t=S.todos.find(function(x){return x.id===id;}); if(t){ t.done=!t.done; save(); refresh(); } renderHomeworkModal(); },
    enableHwNotifications:function(){
      try{
        if(!window.Notification){ alert("Notifications aren't supported in this browser."); return; }
        Notification.requestPermission().then(function(){ renderSettings(); });
      }catch(e){}
    },
    clearDone:function(){ if(confirm("Remove all completed to-dos?")){ S.todos=S.todos.filter(function(t){return !t.done;}); save(); refresh(); } },
    pick:function(el,group){ el.parentNode.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel");}); el.classList.add("sel"); },
    setField:function(path,val){ setPath(S,path,val); save(); renderHeader(); if(path==="anchor") updateRotPreview(); },
    setStart:function(w){ S.startParent=w; save(); renderSettings(); },
    setColor:function(key,c){ parentOf(key).color=c; save(); renderSettings(); renderHeader(); },
    addEventQuick:function(){ eventForm(); },
    exportData:function(){
      var code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      var h='<h3>Sync / backup code</h3><div class="banner">Copy this and send it to your co-parent. They open the hub → Setup → “Paste code to import”. This overwrites their data with yours.</div>'+
        '<textarea class="in" style="min-height:140px;font-family:monospace;font-size:11px" readonly id="expBox">'+code+'</textarea>'+
        '<div style="height:8px"></div><button class="btn block" onclick="FH.doCopy()">Copy to clipboard</button>';
      openSheet(h);
      setTimeout(function(){ document.getElementById("expBox").select(); },50);
    },
    doCopy:function(){ var b=document.getElementById("expBox"); b.select();
      try{ navigator.clipboard.writeText(b.value); }catch(e){ document.execCommand("copy"); }
      var btn=event.target; btn.textContent="Copied ✓"; },
    importData:function(){
      var h='<h3>Import data</h3><div class="banner">Paste a sync code from your co-parent. This replaces everything on this device.</div>'+
        '<textarea class="in" style="min-height:140px;font-family:monospace;font-size:11px" id="impBox" placeholder="Paste code here…"></textarea>'+
        '<div style="height:8px"></div><button class="btn block" onclick="FH.doImport()">Import & replace</button>';
      openSheet(h);
    },
    doImport:function(){
      try{
        var raw=decodeURIComponent(escape(atob(document.getElementById("impBox").value.trim())));
        var obj=JSON.parse(raw); S=Object.assign({},defaults,obj); save(); closeSheet(); renderHeader(); FH.tab("today");
        alert("Imported ✓");
      }catch(e){ alert("That code didn't work. Check you copied all of it."); }
    },
    loadSample:function(){
      var t0=iso(addDays(cur,2)), t1=iso(addDays(cur,5)), t2=iso(addDays(cur,9)), t3=iso(addDays(cur,-1));
      S.events=S.events.concat([
        {id:uid(),title:"Early release day",date:t0,time:"12:30",type:"early",notes:"Pickup 12:30 instead of 3:15"},
        {id:uid(),title:"No school – Teacher day",date:t2,time:"",type:"holiday",notes:""},
        {id:uid(),title:"Class field trip – museum",date:t1,time:"09:00",type:"event",notes:"Pack lunch + $5"}
      ]);
      S.todos=S.todos.concat([
        {id:uid(),title:"Sign & return field trip form",due:t0,who:"a",cat:"form",done:false},
        {id:uid(),title:"Book dentist checkup",due:t1,who:"b",cat:"appt",done:false},
        {id:uid(),title:"Pack soccer cleats for handoff",due:iso(cur),who:"both",cat:"pack",done:false},
        {id:uid(),title:"Refill inhaler prescription",due:t3,who:"a",cat:"appt",done:false}
      ]);
      save(); FH.tab("today"); alert("Sample data added — explore, then Reset when ready.");
    },
    resetAll:function(){ if(confirm("Erase all data on this device and start fresh?")){ S=JSON.parse(JSON.stringify(defaults)); save(); renderHeader(); FH.tab("settings"); } },
    theme:function(){
      var root=document.documentElement;
      var isDark = root.getAttribute("data-theme")==="dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
      root.setAttribute("data-theme", isDark?"light":"dark");
      S.theme = isDark?"light":"dark"; save();
      document.getElementById("themeBtn").textContent = isDark?"☀️":"🌙";
    }
  };
  function setPath(o,path,val){ var p=path.split("."); var t=o; for(var i=0;i<p.length-1;i++) t=t[p[i]]; t[p[p.length-1]]=val; }
  function refresh(){
    var active=document.querySelector("nav.tabs button.active").dataset.tab;
    FH.tab(active);
  }
  window.FH=FH;

  // ---------- init ----------
  document.querySelectorAll("nav.tabs button").forEach(function(b){ b.addEventListener("click",function(){ FH.tab(b.dataset.tab); }); });
  document.getElementById("themeBtn").addEventListener("click",FH.theme);
  if(S.theme){ document.documentElement.setAttribute("data-theme",S.theme); document.getElementById("themeBtn").textContent=S.theme==="dark"?"☀️":"🌙"; }
  renderHeader();
  FH.tab("today");
  // Auto-open Mrs. Rivera's note once per new week
  try{
    if(TEACHER_NOTE && TEACHER_NOTE.week && localStorage.getItem("familyHub.teacherSeen")!==TEACHER_NOTE.week){
      setTimeout(openTeacherModal, 500);
    }
  }catch(e){}
  // Homework check-in: pop up once after 3pm if there's homework due today left unchecked.
  // Only fires while the app is open in a tab — there's no way to alert when it's fully closed.
  setTimeout(checkHomeworkAlert, 1500);
  setInterval(checkHomeworkAlert, 60000);
})();
</script>

</body>
</html>
